<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tya & Mzh Memories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            color: #333333;
            min-height: 100vh;
        }

        /* ပင်မစာမျက်နှာ (Home Section) */
        .hero-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            max-width: 380px;
            width: 100%;
        }

        .hero-card h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #d63031;
            font-weight: bold;
        }

        .hero-card p {
            font-size: 15px;
            color: #2d3436;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ဝင်ရန် ခလုတ် */
        .btn-enter {
            display: inline-block;
            padding: 12px 35px;
            background-color: #ff4757;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            cursor: pointer;
        }

        /* Password Pop-up Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-box h3 {
            margin-bottom: 15px;
            color: #ff4757;
            font-size: 18px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ff4757;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            outline: none;
            color: #000;
        }

        .btn-submit {
            padding: 10px 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .error-msg {
            color: #d63031;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* Gallery Section */
        .gallery-section {
            min-height: 100vh;
            padding: 60px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.05);
        }

        .gallery-section h2 {
            font-size: 24px;
            margin-bottom: 30px;
            color: #d63031;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .photo-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .photo-box {
            height: 160px;
            width: 100%;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            padding: 10px 8px;
            font-size: 13px;
            color: #2d3436;
            line-height: 1.4;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- ပင်မစာမျက်နှာ -->
    <section class="hero-section">
        <div class="hero-card">
            <h1>✨ Tya & Mzh Memories ✨</h1>
            <p>ကျွန်ုပ်တို့ရဲ့ ချစ်စရာ အမှတ်တရလေးများ စုစည်းရာနေရာ</p>
            <button class="btn-enter" onclick="openModal()">ဝင်ရန်</button>
        </div>
    </section>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passModal">
        <div class="modal-box">
            <h3>🔑 Passcode ထည့်ပါ</h3>
            <input type="password" id="passInput" class="password-input" placeholder="Password ရိုက်ပါ">
            <button class="btn-submit" onclick="checkPassword()">အတည်ပြုမည်</button>
            <p class="error-msg" id="errorMsg">Password မှားယွင်းနေပါသည်။</p>
        </div>
    </div>

    <!-- Gallery Section -->
    <section id="memories" class="gallery-section">
        <h2>Our Memories 🤍</h2>
        <div class="photo-grid">
            
            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3467.jpeg" alt="Memory 1">
                </div>
                <div class="photo-caption">
                    အမှတ်တရ စာသား ၁ 💖
                </div>
            </div>

            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3469.jpeg" alt="Memory 2">
                </div>
                <div class="photo-caption">
                    အမှတ်တရ စာသား ၂ 💕
                </div>
            </div>

            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3470.jpeg" alt="Memory 3">
                </div>
                <div class="photo-caption">
                    အမှတ်တရ စာသား ၃ 💓
                </div>
            </div>

            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3677.jpeg" alt="Memory 4">
                </div>
                <div class="photo-caption">
                    အမှတ်တရ စာသား ၄ 💗
                </div>
            </div>

        </div>
    </section>

    <script>
        const correctPassword = "2684";

        function openModal() {
            document.getElementById('passModal').style.display = 'flex';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('passInput').value = '';
        }

        function checkPassword() {
            const userPass = document.getElementById('passInput').value;
            if (userPass === correctPassword) {
                document.getElementById('passModal').style.display = 'none';
                document.getElementById('memories').scrollIntoView({ behavior: 'smooth' });
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
