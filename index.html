<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tya & Mzh Memories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* သဘာဝဆန်ဆန် Earthy Green Theme Background */
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
            color: #2e7d32;
            min-height: 100vh;
        }

        /* ပင်မစာမျက်နှာ (Home Section) */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.9);
            max-width: 380px;
            width: 100%;
        }

        .hero-card h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #1b5e20;
            font-weight: bold;
        }

        .hero-card p {
            font-size: 15px;
            color: #388e3c;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ဝင်ရန် ခလုတ် */
        .btn-enter {
            display: inline-block;
            padding: 12px 35px;
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        /* Password Pop-up Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(27, 94, 32, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            color: #2e7d32;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-box h3 {
            margin-bottom: 15px;
            color: #1b5e20;
            font-size: 18px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #81c784;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            outline: none;
            color: #1b5e20;
        }

        .btn-submit {
            padding: 10px 25px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .error-msg {
            color: #c62828;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* Gallery Section */
        .gallery-section {
            display: none;
            min-height: 100vh;
            padding: 50px 20px;
            text-align: center;
        }

        .gallery-section h2 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #1b5e20;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .photo-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(46, 125, 50, 0.1);
            display: flex;
            flex-direction: column;
            padding-bottom: 12px;
            border: 1px solid #e8f5e9;
        }

        .photo-box {
            height: 150px;
            width: 100%;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            padding: 8px;
            font-size: 13px;
            color: #388e3c;
            font-weight: 500;
        }

        /* ဖတ်ရန် ခလုတ် */
        .btn-read {
            display: inline-block;
            margin: 4px auto 0;
            padding: 6px 18px;
            background-color: #81c784;
            color: #1b5e20;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-read:hover {
            background-color: #66bb6a;
            color: #fff;
        }

        /* ပုံတစ်ပုံချင်းစီအတွက် စာဖတ်ရန် Full Page Overlay */
        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(241, 248, 233, 0.95);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            overflow-y: auto;
        }

        .story-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .story-card img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .story-title {
            font-size: 18px;
            color: #1b5e20;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .story-text {
            font-size: 14px;
            color: #43a047;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
            text-justify: inter-word;
        }

        .btn-close {
            padding: 8px 25px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ပင်မစာမျက်နှာ -->
    <section class="hero-section" id="heroSection">
        <div class="hero-card">
            <h1>🌿 Tya & Mzh Memories 🌿</h1>
            <p>သဘာဝအတိုင်း ရိုးရှင်းလှပသော ကျွန်ုပ်တို့၏ အမှတ်တရများ</p>
            <button class="btn-enter" onclick="openModal()">ဝင်ရန်</button>
        </div>
    </section>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passModal">
        <div class="modal-box">
            <h3>🔑 Passcode ထည့်ပါ</h3>
            <input type="password" id="passInput" class="password-input" placeholder="Password ရိုက်ပါ">
            <button class="btn-submit" onclick="checkPassword()">အတည်ပြုမည်</button>
            <p class="error-msg" id="errorMsg">Password မှားယွင်းနေပါသည်။</p>
        </div>
    </div>

    <!-- Gallery Section -->
    <section id="memories" class="gallery-section">
        <h2>Our Memories 🍃</h2>
        <div class="photo-grid">
            
            <!-- ပုံ ၁ -->
            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3467.jpeg" alt="Memory 1">
                </div>
                <div class="photo-caption">အမှတ်တရ ၁</div>
                <button class="btn-read" onclick="openStory('story1')">ဖတ်ရန် 📖</button>
            </div>

            <!-- ပုံ ၂ -->
            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3469.jpeg" alt="Memory 2">
                </div>
                <div class="photo-caption">အမှတ်တရ ၂</div>
                <button class="btn-read" onclick="openStory('story2')">ဖတ်ရန် 📖</button>
            </div>

            <!-- ပုံ ၃ -->
            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3470.jpeg" alt="Memory 3">
                </div>
                <div class="photo-caption">အမှတ်တရ ၃</div>
                <button class="btn-read" onclick="openStory('story3')">ဖတ်ရန် 📖</button>
            </div>

            <!-- ပုံ ၄ -->
            <div class="photo-card">
                <div class="photo-box">
                    <img src="IMG_3677.jpeg" alt="Memory 4">
                </div>
                <div class="photo-caption">အမှတ်တရ ၄</div>
                <button class="btn-read" onclick="openStory('story4')">ဖတ်ရန် 📖</button>
            </div>

        </div>
    </section>

    <!-- ပုံ ၁ အတွက် စာမျက်နှာ -->
    <div class="story-modal" id="story1">
        <div class="story-card">
            <img src="IMG_3467.jpeg" alt="Memory 1">
            <div class="story-title">🍃 ပထမဆုံး အမှတ်တရလေး</div>
            <div class="story-text">
                ဒီနေရာမှာ ပုံ ၁ နဲ့ ပတ်သက်တဲ့ အမှတ်တရ စာလွှာလေးတွေ၊ ခံစားချက်လေးတွေကို စိတ်ကြိုက် ရှည်ရှည်ဝ
