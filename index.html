<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tya & Mzh Memories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ပင်မစာမျက်နှာ */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 380px;
            width: 100%;
        }

        .hero-card h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            font-weight: bold;
        }

        .hero-card p {
            font-size: 15px;
            color: #fff5f6;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ဝင်ရန် ခလုတ် */
        .btn-enter {
            display: inline-block;
            padding: 12px 35px;
            background-color: #ffffff;
            color: #ff4757;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background-color: #fff0f3;
            transform: translateY(-2px);
        }

        /* Password Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            color: #333;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .modal-box h3 {
            margin-bottom: 15px;
            color: #ff4757;
            font-size: 18px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ff7eb3;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            outline: none;
            color: #333;
        }

        .btn-submit {
            padding: 10px 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4757;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* E-Postcard စာအိတ် Container */
        .postcard-container {
            background: #ffffff;
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            color: #333;
            position: relative;
            min-height: 250px;
        }

        .envelope-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .choice-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            position: relative;
            min-height: 80px;
        }

        .btn-choice-yes {
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            padding: 12px 28px;
            font-size: 16px;
        }

        .btn-choice-no {
            padding: 10px 22px;
            background-color: #e0e0e0;
            color: #555;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease, opacity 0.3s ease;
        }

        /* ဖိတ်စာ စာရွက်ပုံစံ (Letter Card) */
        .letter-section {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
            justify-content: center;
            align-items: center;
        }

        .letter-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 30px 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            color: #333;
            text-align: center;
            border: 2px dashed #ff7eb3;
            margin: auto;
        }

        .letter-header {
            font-size: 22px;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .letter-body {
            font-size: 14.5px;
            color: #444;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-line;
            background: #fff5f6;
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- ပင်မစာမျက်နှာ -->
    <section class="hero-section" id="heroSection">
        <div class="hero-card">
            <h1>🌸 Tya & Mzh Memories 🌸</h1>
            <p>ကျွန်ုပ်တို့ရဲ့ ချစ်စရာ အမှတ်တရလေးများ စုစည်းရာနေရာ</p>
            <button class="btn-enter" onclick="openModal()">ဝင်ရန်</button>
        </div>
    </section>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passModal">
        <div class="modal-box">
            <h3>🔑 Passcode ထည့်ပါ</h3>
            <input type="password" id="passInput" class="password-input" placeholder="Password ရိုက်ပါ">
            <button class="btn-submit" onclick="checkPassword()">အတည်ပြုမည်</button>
            <p class="error-msg" id="errorMsg">Password မှားယွင်းနေပါသည်။</p>
        </div>
    </div>

    <!-- E-Postcard ရွေးချယ်မှု စာအိတ် Box -->
    <div class="modal-overlay" id="postcardModal">
        <div class="postcard-container" id="postcardBox">
            <div class="envelope-icon">💌</div>
            <h3 style="color: #ff4757; margin-bottom: 10px; font-size: 20px;">မောင်တောင်းပန်ပါတယ်</h3>
            <p style="color: #666; font-size: 14px;">စိတ်ဆိုးပြေပါတော့နော်ကလေးလေးရာ... 💕</p>
            
            <div class="choice-container" id="choiceArea">
                <button id="yesBtn" class="btn-choice-yes" onclick="acceptForgiveness()">စိတ်ဆိုးပြေမယ် 💖</button>
                <button id="noBtn" class="btn-choice-no" onmouseover="moveButton()" onclick="moveButton()">စိတ်ဆိုးမပြေဘူး 😒</button>
            </div>
        </div>
    </div>

    <!-- ဖိတ်စာ / တောင်းပန်စာ လှလှလေး ပေါ်မည့် Section (ပုံများ လုံးဝမပါပါ) -->
    <section id="letterSection" class="letter-section">
        <div class="letter-card">
            <div class="letter-header">💌 For My Sweetheart 💌</div>
            <div class="letter-body" id="letterText">
                (ဒီနေရာမှာ နောက်မှ ပေးပို့မယ့် ဖိတ်စာ သို့မဟုတ် တောင်းပန်စာ စာသားတွေကို ထည့်သွင်းပေးပါမည်။)
            </div>
        </div>
    </section>

    <script>
        const correctPassword = "2684";
        let moveCount = 0;

        function openModal() {
            document.getElementById('passModal').style.display = 'flex';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('passInput').value = '';
        }

        function checkPassword() {
            const userPass = document.getElementById('passInput').value;
            if (userPass === correctPassword) {
                document.getElementById('passModal').style.display = 'none';
                document.getElementById('postcardModal').style.display = 'flex';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // စိတ်ဆိုးမပြေဘူး ခလုတ်ကို နှိပ် သို့မဟုတ် Touch လုပ်လိုက်ရင် ပြေးပြီး သေးသွားစေရန်
        function moveButton() {
            moveCount++;
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            if (moveCount < 5) {
                // ခလုတ် ရန်ပြေးရန် Random Position တွက်ချက်ခြင်း
                const randomX = (Math.random() - 0.5) * 160;
                const randomY = (Math.random() - 0.5) * 100;
                
                // စာသားနှင့် အရွယ်အစား သေးသွားစေရန်
                const scale = 1 - (moveCount * 0.18);
                noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scale})`;
                
                // စိတ်ဆိုးပြေမယ် ခလုတ် တဖြည်းဖြည်း ကြီးလာစေရန်
                const yesScale = 1 + (moveCount * 0.15);
                yesBtn.style.transform = `scale(${yesScale})`;
            } else {
                // ၅ ကြိမ်ပြည့်ရင် ပျောက်သွားမည်
                noBtn.style.display = 'none';
                yesBtn.style.transform = `scale(1.4)`;
            }
        }

        // စိတ်ဆိုးပြေမယ် နှိပ်လျှင် ဖိတ်စာ ပေါ်လာစေရန်
        function acceptForgiveness() {
            document.getElementById('postcardModal').style.display = 'none';
            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('letterSection').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
