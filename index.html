<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tya & Mzh Memories</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* ပင်မစာမျက်နှာ (Home Section) */
        .hero-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 380px;
            width: 100%;
        }

        .hero-card h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            font-weight: bold;
        }

        .hero-card p {
            font-size: 15px;
            color: #fff5f6;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* ဝင်ရန် ခလုတ် */
        .btn-enter {
            display: inline-block;
            padding: 12px 35px;
            background-color: #ffffff;
            color: #ff4757;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background-color: #fff0f3;
            transform: translateY(-2px);
        }

        /* Password Pop-up Box */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            color: #333;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .modal-box h3 {
            margin-bottom: 15px;
            color: #ff4757;
            font-size: 18px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ff7eb3;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            outline: none;
            color: #333;
        }

        .btn-submit {
            padding: 10px 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4757;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        /* Gallery Section */
        .gallery-section {
            display: none;
            min-height: 100vh;
            padding: 50px 20px;
            text-align: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
        }

        .gallery-section h2 {
            font-size: 26px;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 500px;
            margin: 0 auto;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            padding-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .photo-box {
            height: 150px;
            width: 100%;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            padding: 8px;
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }

        /* ဖတ်ရန် ခလုတ်များ */
        .btn-read {
            display: inline-block;
            margin: 4px auto 0;
            padding: 6px 18px;
            background-color: #ffffff;
            color: #ff4757;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-read:hover {
            background-color: #fff0f3;
        }

        /* ပုံတစ်ပုံချင်းစီအတွက် စာဖတ်ရန် Full Page Modal */
        .story-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
            overflow-y: auto;
        }

        .story-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 20px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            color: #333;
        }

        .story-card img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .story-title {
            font-size: 18px;
            color: #ff4757;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .story-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
        }

        .btn-close {
            padding: 8px 25px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ပင်မစာမျက်နှာ -->
    <section class="hero-section" id="heroSection">
        <div class="hero-card">
            <h1>🌸 Tya & Mzh Memories 🌸</h1>
            <p>ကျွန်ုပ်တို့ရဲ့ ချစ်စရာ အမှတ်တရလေးများ စုစည်းရာနေရာ</p>
            <button class="btn-enter" onclick="openModal()">ဝင်ရန်</button>
        </div>
    </section>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passModal">
        <div class="modal-box">
            <h3>🔑 Passcode ထည့်ပါ</h3>
            <input type="password" id="passInput" class="password-input" placeholder="Password ရိုက်ပါ">
            <button class="btn-submit" onclick="checkPassword()">အတည်ပြုမည်</button>
            <p class="error-msg" id="errorMsg">Password မှားယွင်းနေပါသည်။</p>
        </div>
    </div>
